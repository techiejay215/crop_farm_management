name: crop_farm_management
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.12.0'   # <-- THIS IS THE CRITICAL LINE

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.0
  image_picker: ^1.1.2
  http: ^1.6.0
  http_parser: ^4.1.2

  # --- NEW: PDF generation & printing ---
  pdf: ^3.11.1
  printing: ^5.13.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  # ---- Android ----
  android: "launcher_icon"
  image_path: "assets/images/licon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#14532D"
  adaptive_icon_foreground: "assets/images/licon.png"

  # ---- iOS ----
  ios: true
  image_path_ios: "assets/images/licon.png"
  remove_alpha_ios: true

  # ---- Web ----
  web:
    generate: true
    image_path: "assets/images/licon.png"
    background_color: "#14532D"
    theme_color: "#14532D"

  # ---- macOS ----
  macos:
    generate: true
    image_path: "assets/images/licon.png"

  # ---- Windows ----
  windows:
    generate: true
    image_path: "assets/images/licon.png"
    icon_size: 256